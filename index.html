<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GDTF Forge</title>
    <base href="/">
    <link rel="preload" href="/styles.css?v=20260512" as="style">
    <link rel="stylesheet" href="/styles.css?v=20260512">
    <style>
      :root {
        --bg: #f5f7f5;
        --panel: #ffffff;
        --panel-strong: #f0f4f1;
        --text: #20242a;
        --muted: #667071;
        --border: #d9dfdc;
        --accent: #13736d;
        --accent-dark: #0d5652;
        --copper: #b45f32;
        --danger: #b93848;
        --focus: #315fba;
        --shadow: 0 18px 46px rgba(25, 35, 40, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, select, textarea { font: inherit; }
      button, a.button { -webkit-tap-highlight-color: transparent; }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 28px clamp(18px, 4vw, 48px) 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(16px);
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .app-header h1, .panel h2 { margin: 0; letter-spacing: 0; }
      .app-header h1 { font-size: 32px; line-height: 1.05; }
      .panel h2 { font-size: 18px; }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--copper);
        font-size: 12px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .header-actions, .button-row, .export-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(280px, 0.86fr) minmax(320px, 1.14fr);
        gap: 18px;
        padding: 22px clamp(18px, 4vw, 48px) 42px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .table-panel, .result-panel { grid-column: 1 / -1; }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .status-pill {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--panel-strong);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .button, .icon-button {
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
      }

      .button {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 7px;
        padding: 9px 13px;
        font-weight: 750;
        color: var(--text);
      }

      .button svg, .icon-button svg { width: 18px; height: 18px; flex: 0 0 auto; }
      .button:hover, .icon-button:hover { transform: translateY(-1px); }
      .button-primary { color: #fff; background: var(--accent); border-color: var(--accent); }
      .button-primary:hover { background: var(--accent-dark); }
      .button-secondary { background: #e8f3f1; border-color: #bad8d5; color: var(--accent-dark); }
      .button-ghost { background: transparent; border-color: var(--border); }
      .button.disabled { pointer-events: none; color: #8f9898; background: #eef1f0; border-color: #e1e5e3; }

      .icon-button {
        width: 38px;
        height: 38px;
        display: inline-grid;
        place-items: center;
        border-radius: 7px;
        background: #f6f8f7;
        border-color: var(--border);
        color: var(--text);
      }

      .dropzone {
        min-height: 178px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 8px;
        padding: 20px;
        border: 1.5px dashed #9fb9b5;
        border-radius: 8px;
        background: #f3faf8;
        cursor: pointer;
        text-align: center;
      }

      .dropzone:hover { border-color: var(--accent); background: #edf7f5; }
      .dropzone input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; pointer-events: none; }

      .dropzone-icon {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #dcefed;
        color: var(--accent);
      }

      .dropzone-title { font-weight: 800; }
      .dropzone-meta { color: var(--muted); font-size: 13px; }
      .field-stack { display: grid; gap: 8px; margin-top: 16px; }

      label {
        display: grid;
        gap: 7px;
        color: #40494d;
        font-size: 13px;
        font-weight: 750;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      input, select { min-height: 40px; padding: 8px 10px; }
      textarea { min-height: 220px; resize: vertical; padding: 12px; line-height: 1.45; }

      input:focus, select:focus, textarea:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(49, 95, 186, 0.14);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .notice-list { display: grid; gap: 8px; margin-top: 14px; }
      .notice { padding: 9px 10px; border: 1px solid #f0cfa1; border-radius: 7px; background: #fff8ed; color: #714416; font-size: 13px; line-height: 1.35; }

      .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
      table { width: 100%; min-width: 980px; border-collapse: collapse; table-layout: fixed; }
      th, td { border-bottom: 1px solid var(--border); padding: 9px; text-align: left; vertical-align: middle; }
      th { background: #f4f6f5; color: #4c5759; font-size: 12px; font-weight: 850; }
      td { background: #fff; }
      tbody tr:last-child td { border-bottom: 0; }
      td input, td select { min-height: 36px; font-size: 13px; }
      .col-channel { width: 84px; }
      .col-action { width: 52px; }
      .empty-row td { height: 70px; color: var(--muted); text-align: center; }
      .delete-row { color: var(--danger); }

      .xml-preview {
        min-height: 280px;
        max-height: 520px;
        overflow: auto;
        margin: 16px 0 0;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #182023;
        color: #dce8e6;
        font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre;
      }

      @media (max-width: 920px) {
        .app-header { position: static; align-items: flex-start; flex-direction: column; }
        .app-shell { grid-template-columns: 1fr; }
        .form-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 560px) {
        .app-header, .app-shell { padding-left: 14px; padding-right: 14px; }
        .app-header h1 { font-size: 28px; }
        .panel { padding: 14px; }
        .header-actions, .button-row, .export-actions { width: 100%; }
        .button { flex: 1 1 auto; }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Vercel-ready Generator</p>
        <h1>GDTF Forge</h1>
      </div>
      <div class="header-actions">
        <button class="button button-ghost" id="loadSample" type="button">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          Beispiel
        </button>
        <button class="button button-primary" id="generateGdtfTop" type="button">
          <i data-lucide="file-archive" aria-hidden="true"></i>
          GDTF erstellen
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel upload-panel" aria-labelledby="upload-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Input</p>
            <h2 id="upload-title">Uploads</h2>
          </div>
          <span class="status-pill" id="parseStatus">Bereit</span>
        </div>

        <label class="dropzone" for="fileInput">
          <input id="fileInput" type="file" multiple accept=".pdf,.txt,.csv,.tsv,.md,text/*,application/pdf">
          <span class="dropzone-icon"><i data-lucide="upload-cloud" aria-hidden="true"></i></span>
          <span class="dropzone-title">Datasheets und DMX-Sheets</span>
          <span class="dropzone-meta">PDF, TXT, CSV oder TSV</span>
        </label>

        <div class="field-stack">
          <label for="rawText">Textauszug</label>
          <textarea id="rawText" spellcheck="false" placeholder="DMX chart hier einfuegen oder Upload verarbeiten lassen"></textarea>
        </div>

        <div class="button-row">
          <button class="button button-secondary" id="parseText" type="button">
            <i data-lucide="scan-text" aria-hidden="true"></i>
            Text erkennen
          </button>
          <button class="button button-ghost" id="clearInput" type="button">
            <i data-lucide="eraser" aria-hidden="true"></i>
            Leeren
          </button>
        </div>

        <div class="notice-list" id="warnings" aria-live="polite"></div>
      </section>

      <section class="panel meta-panel" aria-labelledby="meta-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Fixture</p>
            <h2 id="meta-title">Metadaten</h2>
          </div>
        </div>

        <div class="form-grid">
          <label>
            Hersteller
            <input id="manufacturer" autocomplete="organization" value="Generic">
          </label>
          <label>
            Geraetename
            <input id="fixtureName" value="LED Fixture">
          </label>
          <label>
            Kurzname
            <input id="shortName" value="LED">
          </label>
          <label>
            DMX-Modus
            <input id="modeName" value="Default">
          </label>
          <label>
            Lampentyp
            <select id="lampType">
              <option>LED</option>
              <option>Discharge</option>
              <option>Tungsten</option>
              <option>Halogen</option>
            </select>
          </label>
          <label>
            Beam-Typ
            <select id="beamType">
              <option>Wash</option>
              <option>Spot</option>
              <option>Rectangle</option>
              <option>Fresnel</option>
              <option>PC</option>
              <option>Glow</option>
              <option>None</option>
            </select>
          </label>
          <label>
            Leistung W
            <input id="powerConsumption" type="number" min="0" step="1" value="100">
          </label>
          <label>
            Lumen
            <input id="luminousFlux" type="number" min="0" step="1" value="3000">
          </label>
          <label>
            Beam angle
            <input id="beamAngle" type="number" min="0" step="0.1" value="25">
          </label>
          <label>
            Field angle
            <input id="fieldAngle" type="number" min="0" step="0.1" value="25">
          </label>
        </div>
      </section>

      <section class="panel table-panel" aria-labelledby="dmx-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Output Mapping</p>
            <h2 id="dmx-title">DMX-Kanaele</h2>
          </div>
          <button class="icon-button" id="addRow" type="button" title="Kanal hinzufuegen" aria-label="Kanal hinzufuegen">
            <i data-lucide="plus" aria-hidden="true"></i>
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-channel">CH</th>
                <th>Bezeichnung</th>
                <th>GDTF-Attribut</th>
                <th>Phys. von</th>
                <th>Phys. bis</th>
                <th>Sets</th>
                <th>Bit</th>
                <th class="col-action"></th>
              </tr>
            </thead>
            <tbody id="rowsBody">
              <tr class="empty-row">
                <td colspan="8">Noch keine Kanaele erkannt.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel result-panel" aria-labelledby="result-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Export</p>
            <h2 id="result-title">GDTF-Paket</h2>
          </div>
          <span class="status-pill" id="exportStatus">Noch nicht erstellt</span>
        </div>

        <div class="export-actions">
          <button class="button button-primary" id="generateGdtf" type="button">
            <i data-lucide="file-archive" aria-hidden="true"></i>
            GDTF erstellen
          </button>
          <a class="button button-secondary disabled" id="downloadGdtf" download>
            <i data-lucide="download" aria-hidden="true"></i>
            Download
          </a>
          <a class="button button-ghost disabled" id="downloadXml" download="description.xml">
            <i data-lucide="code-xml" aria-hidden="true"></i>
            XML
          </a>
        </div>

        <pre id="xmlPreview" class="xml-preview" aria-label="XML Vorschau"></pre>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>
    <script type="module" src="/src/app.js?v=20260512"></script>
    <script>
      window.addEventListener("error", function (event) {
        if (String(event.filename || "").includes("app.js")) {
          var warning = document.getElementById("warnings");
          if (warning) {
            warning.innerHTML = '<div class="notice">App-Skript konnte nicht geladen werden. Bitte Deployment-Cache in Vercel neu ausloesen.</div>';
          }
        }
      }, true);
    </script>
  </body>
</html>
